# diagnostics.yml：诊断规则/阈值配置
diagnostics:
  rules:
    - id: checkout-error-spike
      description: "Checkout 服务 HTTP 5xx 错误率飙升"
      severity: HIGH
      metric: http_error_rate
      threshold: 2.0
      keywords:
        - checkout
        - "HTTP 5xx"
      suggested-actions:
        - restart-checkout
        - rollback-checkout
    - id: latency-regression
      description: "Checkout 服务延迟超出 SLO 目标"
      severity: MEDIUM
      metric: latency_p95
      threshold: 400.0
      keywords:
        - timeout
      suggested-actions:
        - restart-checkout
