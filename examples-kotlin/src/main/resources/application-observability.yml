# Spring AI 的观测性配置（追踪与日志）
# 这是应用侧关注点，未来版本会从库中移除
spring:
  ai:
    chat:

      client:
        observations:
          log-prompt: false             # 是否记录 ChatClient 的提示词
      observations:
        log-prompt: false               # 是否记录 ChatModel 的提示词
        log-completion: false           # 是否记录 ChatModel 的响应
        include-error-logging: true     # 是否包含错误详情
embabel:
  models:
    default-llm: deepseek-chat

# 观测性与追踪配置
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0                 # 抽样 100% 的链路（生产建议 0.1）

  # Zipkin 配置
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
